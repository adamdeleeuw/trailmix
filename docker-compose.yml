# Requires Docker Compose v2.24+ for the `env_file: required:` syntax below.
#
# Local development: `docker compose up --build -d` (or ./scripts/run-backend.sh).
# Production (the GCP VM) layers docker-compose.prod.yml on top; see
# scripts/deploy-backend.sh.

name: cpen321-project

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Published on all interfaces so a physical Android device on the same Wi-Fi
    # can reach it. Emulators use http://10.0.2.2:3000 either way.
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
    environment:
      # overrides backend/.env, which points at localhost for `npm run dev`
      MONGODB_URI: mongodb://mongo:27017/trailmix
    depends_on:
      mongo:
        condition: service_healthy

  # Data lives in the mongo-data volume, so it survives container restarts,
  # rebuilds and deploys, and only `docker compose down -v` deletes it.
  mongo:
    # not 8.x: its allocator makes mongod refuse to start on Linux 6.19+ kernels, which the VM runs (SERVER-121912)
    image: mongo:7.0
    restart: unless-stopped
    # loopback only: reachable by tests and `npm run dev` on this machine, not by
    # other devices on the network. production removes this mapping entirely.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  mongo-data:
