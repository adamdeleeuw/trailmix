# Backend CI/CD: on every push to main that touches the backend or its
# deployment config, typecheck and test; if that passes, SSH into the GCP VM and
# run scripts/deploy-backend.sh. Pull requests only get the test job.
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   VM_HOST     the VM's static IP (136.67.54.50)
#   VM_USER     the VM account that owns ~/cpen321-m1 and is in the docker group
#   VM_SSH_KEY  private key whose public half is in the VM's ssh-keys metadata

name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "scripts/deploy-backend.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch: # "Run workflow" button, for redeploying by hand

# never run two deploys at once; a newer push waits for the running one
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # same image the VM runs, so tests get a real database rather than a mock
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
      # empty until the secret is added (and on PRs from forks), which skips the Codacy upload
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # mocked, unmocked, then combined, each with its own coverage report
      - run: bash ../scripts/run-backend-interface-tests.sh
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const pct = (m) => `${m.pct}% (${m.covered}/${m.total})`;
            const rows = [["Mocked", "mock"], ["Unmocked", "no-mock"], ["Combined", "interface"]]
              .filter(([, dir]) => fs.existsSync(`coverage/${dir}/coverage-summary.json`))
              .map(([label, dir]) => {
                const t = JSON.parse(fs.readFileSync(`coverage/${dir}/coverage-summary.json`, "utf8")).total;
                return `| ${label} | ${pct(t.statements)} | ${pct(t.branches)} | ${pct(t.functions)} | ${pct(t.lines)} |`;
              });
            console.log(["## Backend coverage", "", "| Run | Statements | Branches | Functions | Lines |", "| --- | --- | --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      # HTML reports for all three runs, downloadable from the run page
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
      # only the combined run, so Codacy shows the real total
      - uses: codacy/codacy-coverage-reporter-action@v1.3.0
        if: env.CODACY_PROJECT_TOKEN != ''
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: backend/coverage/interface/lcov.info
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://136-67-54-50.sslip.io/health
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 15m
          script: bash ~/cpen321-m1/scripts/deploy-backend.sh
